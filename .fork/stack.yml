# Fork stack manifest
#
# Canonical shared metadata for the b3nw LLM-API-Key-Proxy fork.
# `dev` is a rewritten linear stack on top of upstream/dev. This manifest records
# the intended stack order and maps stack commits to durable feature IDs.
#
# Keep this file in the repo so every contributor/workspace sees the same feature
# ownership and ordering rules.

base: upstream/dev
branch: dev

rules:
  linear_history: true
  no_merge_commits: true
  local_state_is_non_canonical: true
  canonical_feature_history: .fork/features
  allow_multiple_commits_per_feature: false
  allowed_duplicate_features:
    # Historical split predating the shared .fork metadata. Do not add new
    # duplicates here without documenting the exception in the feature ledger.
    gemini-cli:
      - "fix(gemini-cli): fast-fail on non-rotatable errors and pro quota handling"
      - "feat(gemini-cli): expose gemini-3.5-flash, unify quota groups, fix token counts"
      - "feat(gemini-cli): add Gemini 3.6 Flash and 3.5 Flash-Lite CCPA mappings"
    xai:
      - "feat(xai): add xAI Grok OAuth provider with PKCE and Device Code flows"
      - "feat(xai): enable xAI Grok device-code OAuth in admin WebUI"
      - "fix(xai): set Grok Build User-Agent on all requests to fix billing classification"
      - "feat(xai): route all chat completions through CLI proxy"
    cline-pass:
      - "fix(cline-pass): correct upstream-id reverse map and API base path"
      - "feat(cline-pass): add ClinePass provider with 3-window quota tracking"
    umans:
      - "feat(umans): add Umans provider with request-based quota tracking"
      - "fix(umans): normalize API base and show quota without proxy requests"
    codex:
      - "feat(codex): Responses API rewrite, dynamic model discovery, and OAuth exports"
      - "fix(codex): return Codex CLI-compatible /v1/models response"
    webui:
      - "feat(webui): add React web UI with admin dashboard, quota viewer, log explorer, and settings"
      - "fix(webui): hot-load custom providers and API keys without restart"
    anthropic:
      - "feat(anthropic): add OAuth support and handle streaming nulls"
      - "fix(anthropic): update Claude model matrix with current Anthropic models"
      - "feat(anthropic): dynamic model discovery via models.dev"
      - "fix(anthropic): update user agent and add claude-sonnet-5 alias"
      - "fix(anthropic): return None when all models.dev entries are filtered"
      - "fix(anthropic): mirror pi-agent OAuth headers and tool naming"
      - "fix(anthropic): back off quota polling on 429 and flag stale quota in UI"
      - "fix(anthropic): send Claude Code User-Agent on OAuth usage fetch"
    proxy:
      - "feat(proxy): outbound HTTP/SOCKS5 proxy support with per-provider/credential routing"
      - "fix(proxy): resolve per-credential proxy routing and improve observability"
      - "fix(proxy): route provider plugins with custom logic through the configured proxy"
    ci:
      - "feat(ci): fork-aware release notes with incremental topic diff"
      - "fix(ci): add AI PR review workflow"
      - "fix(ci): support fork PRs via pull_request_target in ai-review workflow"
      - "fix(ci): allow unsafe pr checkout for ai-review workflow"
    tooling:
      - "feat(tooling): add AGENTS.md and .agent/ config for linear stack workflow"
      - "fix(tooling): scope fork-stack gate to canonical branch and tolerate transient commits"
      - "fix(tooling): update AGENTS.md to feature-branch PR workflow"
    # `fix(models):` is a one-off topic prefix that doesn't match the registered
    # `model-routing` feature id, but its ledger entry lives in
    # .fork/features/model-routing.md. Key the exception by the literal prefix
    # text since that's what check-stack.py matches against.
    models:
      - "fix(models): skip alias models already listed by their provider"
  # Exact commit subjects permitted in the stack without a feature mapping.
  # Legacy batch commits that predate the per-feature stack convention; do not
  # add new bare-`feat:` commits here — use a scoped `feat(<feature>):` prefix.
  allowed_subjects:
    - "feat: Jules code health improvements (6 items)"
    - "feat: Jules auto-improvement batch (7 sessions)"

features:
  - id: lightning-ai
    prefix: "feat(lightning-ai)"
    subject: "feat(lightning-ai): dollar credit quotas and date parsing"
    files:
      - "src/rotator_library/providers/lightning_ai*"
      - "src/rotator_library/providers/utilities/lightning_ai*"
      - "src/rotator_library/providers/_retired/*"

  - id: anthropic
    prefix: "feat(anthropic)"
    subject: "feat(anthropic): add OAuth support and handle streaming nulls"
    files:
      - "src/rotator_library/providers/anthropic*"
      - "src/rotator_library/providers/utilities/anthropic*"

  - id: chutes
    prefix: "feat(chutes)"
    subject: "feat(chutes): dollar quota tracking with sliding window"
    files:
      - "src/rotator_library/providers/chutes*"
      - "src/rotator_library/providers/utilities/chutes*"

  - id: codex
    prefix: "feat(codex)"
    subject: "feat(codex): Responses API rewrite, dynamic model discovery, and OAuth exports"
    files:
      - "src/rotator_library/providers/codex*"
      - "src/rotator_library/providers/utilities/codex*"

  - id: opencode-zen
